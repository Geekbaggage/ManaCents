# ManaCents analytics retention cleanup — deletes raw events older than 30 days.
# CEO-approved retention policy (2026-11-04): 30 days raw, no long-term
# per-event storage. Aggregates are computed on demand via operator tooling.
name: analytics-cleanup

concurrency:
  group: manacents-d1
  cancel-in-progress: false

on:
  schedule:
    - cron: "0 7 * * *" # daily 07:00 UTC, after price sync
  workflow_dispatch: # manual trigger

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Delete events older than 30 days
        working-directory: web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler d1 execute manacents-db --remote \
            --command="DELETE FROM analytics_events WHERE created_at < datetime('now', '-30 days')" \
            --json | python3 -c "import json,sys; d=json.load(sys.stdin); print('deleted:', d[0]['meta']['changes'] if d else 'unknown')"
