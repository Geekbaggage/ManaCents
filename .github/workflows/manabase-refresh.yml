# ManaBase nightly data refresh — prices + eligibility checks.
#
# Re-fetches cheapest-printing prices (any finish) for the 45 seed lands,
# re-checks the official Game Changer list and Commander banned status,
# and regenerates web/functions/api/_manabase_lands.json from the FROZEN
# seed v0.4.2. The script is fail-closed: any fetch failure aborts
# without writing serving data.
#
# When the data changes, the workflow commits and pushes to main, which
# triggers the deploy-pages workflow (web/** changed) and ships the fresh
# snapshot to production. No change = no commit, no deploy.
name: manabase-refresh

concurrency:
  group: manabase-refresh
  cancel-in-progress: false

permissions:
  contents: write

on:
  schedule:
    - cron: "30 7 * * *" # daily 07:30 UTC (after price-sync 06:00, fulfill 07:00)
  workflow_dispatch: # manual trigger

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Refresh land prices + eligibility
        run: node scripts/manabase-refresh.mjs
      - name: Commit refreshed data
        run: |
          git config user.name "ManaCents Refresh"
          git config user.email "hello@manacents.com"
          git add web/functions/api/_manabase_lands.json scripts/manabase-refresh/
          git diff --cached --quiet && echo "no data changes" && exit 0
          git commit -m "ManaBase: nightly price refresh $(date -u +%F)"
          git push
