# ManaCents site deploy — builds web/ and deploys to Cloudflare Pages
# on every push to main that touches the site. Uses the repo's existing
# CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID secrets.
name: deploy-pages

on:
  push:
    branches: [main]
    paths: ["web/**"]
  workflow_dispatch: # manual trigger

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build site
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages deploy web/dist --project-name=manacents
